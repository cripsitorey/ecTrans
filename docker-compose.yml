services:
  postgres:
    image: postgres:16-alpine
    container_name: ectrans-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ectrans
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ectrans_dev_password}
      POSTGRES_DB: ectrans
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ectrans-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ectrans -d ectrans"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ectrans-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-ectrans_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-ectrans_minio_secret}
    volumes:
      - minio_data:/data
    networks:
      - ectrans-net

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: ectrans-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
        echo 'Esperando MinIO...';
        sleep 2;
      done;
      mc mb --ignore-existing local/$${MINIO_BUCKET};
      mc anonymous set none local/$${MINIO_BUCKET};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-ectrans_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-ectrans_minio_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-ectrans-documents}
    networks:
      - ectrans-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: ectrans-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ectrans:${POSTGRES_PASSWORD:-ectrans_dev_password}@postgres:5432/ectrans
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      RUN_MIGRATIONS: "true"
      RUN_SEED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    networks:
      - ectrans-net

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: ectrans-worker
    profiles:
      - imap
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ectrans:${POSTGRES_PASSWORD:-ectrans_dev_password}@postgres:5432/ectrans
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - ectrans-net

networks:
  ectrans-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
